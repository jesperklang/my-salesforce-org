<template>
  <lightning-modal-header label={label}></lightning-modal-header>
  <lightning-modal-body>
    <div class="slds-form" role="list">
      <template for:each={fields} for:item="field">
        <div
          key={field.apiName}
          class="slds-form-element slds-form-element_readonly slds-form-element_horizontal"
          role="listitem"
        >
          <span class="slds-form-element__label">{field.label}</span>
          <div class="slds-form-element__control">
            <div class="slds-form-element__static">{field.value}</div>
          </div>
        </div>
      </template>
    </div>
  </lightning-modal-body>
  <lightning-modal-footer>
    <lightning-button
      label="Close"
      onclick={handleClose}
      class="slds-var-m-right_x-small"
    ></lightning-button>
    <lightning-button
      variant="brand"
      label="View Record"
      onclick={handleViewRecord}
    ></lightning-button>
  </lightning-modal-footer>
</template>
