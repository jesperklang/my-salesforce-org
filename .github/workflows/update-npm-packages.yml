# Daily workflow that runs `npm run updateAll:ci` and opens (or updates) a PR
# on `maintenance/package-update` whenever npm package files change.
name: Update npm packages

on:
  schedule:
    # Run daily at 18:00 UTC.
    - cron: "0 18 * * *"
  # Allow manual ad-hoc runs from the GitHub Actions tab.
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

# Prevent overlapping runs from racing on the same update branch.
concurrency:
  group: update-npm-packages
  cancel-in-progress: false

env:
  BASE_BRANCH: main
  UPDATE_BRANCH: maintenance/package-update

jobs:
  update-packages:
    runs-on: ubuntu-latest
    steps:
      # Full history is needed to inspect and merge the existing update branch.
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.BASE_BRANCH }}
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      # Reuse the existing update branch (merging latest main into it) or create it from main.
      - name: Prepare ${{ env.UPDATE_BRANCH }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git show-ref --verify --quiet "refs/remotes/origin/$UPDATE_BRANCH"; then
            git switch -c "$UPDATE_BRANCH" "origin/$UPDATE_BRANCH"
            if ! git merge --no-edit "origin/$BASE_BRANCH"; then
              git merge --abort
              echo "::error::Could not merge $BASE_BRANCH into $UPDATE_BRANCH because of conflicts. Resolve them manually and rerun the workflow."
              exit 1
            fi
          else
            git switch -c "$UPDATE_BRANCH"
          fi

      # Install after switching branches so node_modules matches this branch's lockfile.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      # Updates repo/bundle npm packages, sets step outputs (packages-changed,
      # worst-severity-unresolved), and writes the Markdown report to summary.md.
      - name: Update npm packages
        id: update
        run: npm run updateAll:ci -- --output-dir="$RUNNER_TEMP/updateAll-output"

      # Skip committing when no package files changed.
      - name: Commit changes
        id: commit
        env:
          PACKAGES_CHANGED: ${{ steps.update.outputs.packages-changed }}
        run: |
          if [ "$PACKAGES_CHANGED" != "true" ] || [ -z "$(git status --porcelain)" ]; then
            echo "No npm package changes."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git add -A
          git commit -m "Update npm packages"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # Check whether an open PR already exists for the update branch.
      - name: Find open pull request
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          number="$(gh pr list --head "$UPDATE_BRANCH" --base "$BASE_BRANCH" --state open --json number --jq '.[0].number // empty')"
          echo "number=$number" >> "$GITHUB_OUTPUT"

      # Also push when only main was merged in, so an open pull request stays up to date.
      - name: Push ${{ env.UPDATE_BRANCH }}
        if: steps.commit.outputs.changed == 'true' || steps.pr.outputs.number != ''
        run: git push origin "HEAD:refs/heads/$UPDATE_BRANCH"

      - name: Create or update pull request
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          PR_TITLE: Update npm packages
          WORST_SEVERITY_UNRESOLVED: ${{ steps.update.outputs.worst-severity-unresolved }}
          CRITICAL_MENTIONS: ${{ vars.CRITICAL_MENTIONS }}
        run: |
          body_file="$RUNNER_TEMP/pull-request-body.md"
          section_file="$RUNNER_TEMP/updateAll-section.md"
          summary_file="$RUNNER_TEMP/updateAll-output/summary.md"
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

          # Severity scale from updateAll: 0=none, 1=info, 2=low, 3=moderate, 4=high, 5=critical.
          has_critical=false
          if [ "${WORST_SEVERITY_UNRESOLVED:-0}" -ge 5 ]; then
            has_critical=true
          fi

          # Convert comma-separated usernames from CRITICAL_MENTIONS into "@user1 @user2".
          mentions=""
          if [ "$has_critical" = "true" ] && [ -n "$CRITICAL_MENTIONS" ]; then
            IFS=',' read -ra raw_users <<< "$CRITICAL_MENTIONS"
            for user in "${raw_users[@]}"; do
              user="${user#"${user%%[![:space:]]*}"}"
              user="${user%"${user##*[![:space:]]}"}"
              user="${user#@}"
              if [ -n "$user" ]; then
                mentions="${mentions:+$mentions }@$user"
              fi
            done
          fi

          # Build this run's dated Markdown section (including a critical callout if needed).
          {
            printf '## Update output (%s)\n\n[Workflow run](%s)\n\n' "$(date -u +%F)" "$run_url"
            if [ "$has_critical" = "true" ]; then
              printf '> [!CAUTION]\n> Critical vulnerabilities could not be fixed automatically.%s\n\n' "${mentions:+ $mentions}"
            fi
            cat "$summary_file"
          } > "$section_file"

          # Append to an existing pull request so earlier updates stay documented.
          if [ -n "$PR_NUMBER" ]; then
            gh pr view "$PR_NUMBER" --json body --jq .body > "$body_file"
            printf '\n\n' >> "$body_file"
            cat "$section_file" >> "$body_file"
            edit_args=(--title "$PR_TITLE" --body-file "$body_file")
            if [ "$has_critical" = "true" ]; then
              edit_args+=(--add-label "critical")
            fi
            gh pr edit "$PR_NUMBER" "${edit_args[@]}"
          else
            # Create a new pull request with the maintenance label (plus critical if unresolved).
            {
              printf 'Automated update of npm packages by the daily **%s** workflow.\n\n' "$GITHUB_WORKFLOW"
              cat "$section_file"
            } > "$body_file"
            create_args=(
              --base "$BASE_BRANCH"
              --head "$UPDATE_BRANCH"
              --title "$PR_TITLE"
              --body-file "$body_file"
              --label "maintenance"
            )
            if [ "$has_critical" = "true" ]; then
              create_args+=(--label "critical")
            fi
            gh pr create "${create_args[@]}"
          fi
